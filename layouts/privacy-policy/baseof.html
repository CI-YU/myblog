<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.Direction | default "auto" }}">

<head>
    {{- partial "head.html" . }}
    <style>
        body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
        h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
        h3 { margin-top: 2rem; }
        hr { margin: 1.5rem 0; border: none; border-top: 1px solid #e0e0e0; }
        .meta { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    </style>
</head>

<body>
    <main>
        {{- block "main" . }}{{ end }}
    </main>
</body>

</html>
